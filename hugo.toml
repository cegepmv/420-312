baseURL = 'https://cegepmv.github.io/420-312'
locale = 'fr-ca'
languageCode = 'fr-fr'
theme = 'hugo-theme-relearn'
enableEmoji = true

[params]
  disableInlineCopyToClipBoard = true
  disableLandingPageButton = true
  themeVariant = ['zen-dark', 'zen-light']
  collapsibleMenu = true
  alwaysopen = false
  linkTitle = 'RÉSEAUX INFORMATIQUES'
  [params.logo]
    src = '/images/logo.png'
    direction = 'row'
  [params.search]
    disable = true
    [params.search.index]
      disable = true

    [params.search.page]
      disable = true
  
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true